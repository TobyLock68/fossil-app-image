<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>Fossil Collector Pro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-color: #1c1c1e;
      --card-bg: #2c2c2e;
      --accent-color: #0a84ff;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --border-color: #38383a;
      --success-color: #30d158;
      --danger-color: #ff453a;
      --warning-color: #ffd60a;
      --neon-blue: #00f3ff;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* --- SPLASH SCREEN STYLES --- */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .neon-svg {
      width: 220px;
      height: 220px;
      /* Cyan neon glow filters */
      filter: drop-shadow(0 0 4px #ffffff) 
              drop-shadow(0 0 10px var(--neon-blue)) 
              drop-shadow(0 0 25px var(--neon-blue));
    }

    .neon-path {
      fill: none;
      stroke: var(--neon-blue);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawClockwise 2.5s ease-in-out forwards infinite;
    }

    @keyframes drawClockwise {
      0% {
        stroke-dashoffset: 1000;
        opacity: 0.3;
      }
      50% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      90% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      100% {
        stroke-dashoffset: -1000;
        opacity: 0.2;
      }
    }

    .splash-title {
      margin-top: 30px;
      font-size: 1.1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 8px var(--neon-blue);
      font-weight: 600;
    }

    /* --- MAIN APP UI STYLES --- */
    .container {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 16px;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .nav-btn {
      padding: 10px 4px;
      font-size: 0.82rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--subtext-color);
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      position: relative;
    }

    .nav-btn.active {
      background-color: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .badge {
      background-color: var(--danger-color);
      color: white;
      border-radius: 10px;
      padding: 2px 6px;
      font-size: 0.7rem;
      margin-left: 4px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    label {
      font-size: 0.8rem;
      color: var(--subtext-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 6px;
      margin-top: 10px;
    }

    select, button, input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #3a3a3c;
      color: var(--text-color);
      font-size: 0.95rem;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    button {
      background-color: var(--accent-color);
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { opacity: 0.8; }

    .button-group {
      display: flex;
      gap: 10px;
    }

    .button-group button { flex: 1; }

    .btn-cancel {
      background-color: #48484a;
      color: var(--danger-color);
    }

    .preview-img {
      width: 100%;
      border-radius: 8px;
      display: none;
      margin-bottom: 12px;
    }

    .status {
      text-align: center;
      font-size: 0.85rem;
      color: var(--subtext-color);
      min-height: 20px;
    }

    .queue-item {
      display: flex;
      gap: 10px;
      background-color: #3a3a3c;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      align-items: center;
    }

    .queue-thumb {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid var(--accent-color);
    }

    .queue-controls { flex: 1; }
    .queue-controls select { padding: 6px; font-size: 0.8rem; margin-bottom: 6px; }

    .queue-action-btns { display: flex; gap: 6px; }
    .queue-action-btns button { padding: 6px; font-size: 0.8rem; margin-bottom: 0; flex: 1; }

    .btn-save { background-color: var(--success-color); }
    .btn-delete { background-color: var(--danger-color); }

    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.95);
      touch-action: none;
      overflow: hidden;
    }

    .modal-wrapper {
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden;
    }

    .modal-content {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      transition: transform 0.1s ease-out;
      transform-origin: center center;
    }

    .close-modal {
      position: absolute; top: 20px; right: 20px;
      color: white; font-size: 24px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%; width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 2001;
    }

    .location-tag {
      font-size: 0.75rem;
      color: var(--warning-color);
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <!-- NEON SPLASH SCREEN -->
  <div id="splash-screen">
    <svg class="neon-svg" viewBox="0 0 200 200">
      <!-- Spiral Ammonite Shell + Tentacles -->
      <path class="neon-path" d="
        M 100 100 
        m -5 0 a 5 5 0 1 1 10 0 a 5 5 0 1 1 -10 0
        m -10 0 a 15 15 0 1 1 30 0 a 15 15 0 1 1 -30 0
        m -15 0 a 30 30 0 1 1 60 0 a 30 30 0 1 1 -60 0
        m -20 0 a 50 50 0 1 1 100 0 a 50 50 0 1 1 -100 0
        M 150 100 
        C 150 130 130 155 100 155
        C 75 155 60 140 50 120
        C 40 135 30 145 20 135
        C 15 125 30 120 40 115
        C 25 115 10 110 15 98
        C 20 90 35 100 45 105
        C 30 95 20 85 28 75
        C 35 68 45 85 55 95
      " />
      <!-- Rib lines on outer shell -->
      <path class="neon-path" d="
        M 100 50 L 100 35
        M 135 65 L 148 55
        M 150 100 L 165 100
        M 135 135 L 148 145
        M 100 150 L 100 165
      " />
    </svg>
    <div class="splash-title">Fossil Collector</div>
  </div>

  <div class="container">
    <h1>Fossil Collector</h1>

    <div class="nav-grid">
      <button class="nav-btn active" onclick="switchTab('uploadTab')">📷 Upload</button>
      <button class="nav-btn" onclick="switchTab('identifyTab')">🔍 Identify</button>
      <button class="nav-btn" onclick="switchTab('queueTab')">📥 Queue <span id="queueBadge" class="badge" style="display:none;">0</span></button>
    </div>

    <!-- TAB 1: UPLOAD -->
    <div id="uploadTab" class="tab-content">
      <div class="card">
        <label for="groupSelect">1. Fossil Group</label>
        <select id="groupSelect" onchange="updateSpeciesDropdown()">
          <option value="ALL">-- Show All Species --</option>
          <option value="AMMONITE">Ammonites & Cephalopods</option>
          <option value="TRILOBITE">Trilobites</option>
          <option value="SHELL">Brachiopods & Bivalves</option>
          <option value="ECHINOID">Echinoids (Sea Urchins)</option>
          <option value="VERTEBRATE">Vertebrates, Teeth & Reptiles</option>
          <option value="CORAL_PLANT">Corals, Crinoids & Plants</option>
          <option value="OTHER">Trace Fossils & Amber</option>
        </select>

        <label for="categorySelect">2. Target Species</label>
        <select id="categorySelect" onchange="showLocationInfo()">
          <option value="UNSORTED">-- Unsorted / Assign Later --</option>
        </select>

        <div id="locationInfo" class="location-tag"></div>

        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
        <button id="snapBtn">📷 Take Photo</button>
        <img id="imagePreview" class="preview-img" alt="Preview">
        
        <div id="actionControls" class="button-group" style="display:none;">
          <button id="cancelBtn" class="btn-cancel">&#10005; Cancel</button>
          <button id="uploadBtn">Upload Photo</button>
        </div>

        <div id="statusText" class="status"></div>
      </div>
    </div>

    <!-- TAB 2: IDENTIFY -->
    <div id="identifyTab" class="tab-content" style="display: none;">
      <div class="card">
        <h3>Offline Identification</h3>
        <p style="font-size: 0.85rem; color: var(--subtext-color);">
          Filter by target region or formation to constrain offline classification.
        </p>

        <label for="locationFilter">Found Location / Region</label>
        <select id="locationFilter">
          <option value="ALL">-- Any Location --</option>
          <option value="Charmouth / Lyme Regis">Charmouth / Lyme Regis (Blue Lias)</option>
          <option value="Whitby / Yorkshire Coast">Whitby / Yorkshire Coast</option>
          <option value="Folkestone / Gault Clay">Folkestone / Gault Clay</option>
          <option value="Cotswolds / Inferior Oolite">Cotswolds / Inferior Oolite</option>
          <option value="Isle of Wight">Isle of Wight</option>
        </select>

        <button onclick="alert('Offline ML model inference module pending integration.')">🔍 Run Offline Identifier</button>
      </div>
    </div>

    <!-- TAB 3: DRAFTS QUEUE -->
    <div id="queueTab" class="tab-content" style="display: none;">
      <div class="card">
        <h3>Offline Drafts (<span id="queueCount">0</span>)</h3>
        <p style="font-size:0.8rem; color: var(--subtext-color);">Tap image thumbnail to inspect with pinch-to-zoom.</p>
        <div id="queueContainer"></div>
      </div>
    </div>

  </div>

  <!-- ZOOM MODAL -->
  <div id="imageModal" class="modal">
    <div class="close-modal" onclick="closeModal()">&#10005;</div>
    <div class="modal-wrapper" id="modalWrapper">
      <img id="modalImg" class="modal-content">
    </div>
  </div>

    const cameraInput = document.getElementById('cameraInput');
    const snapBtn = document.getElementById('snapBtn');
    const actionControls = document.getElementById('actionControls');
    const uploadBtn = document.getElementById('uploadBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const imagePreview = document.getElementById('imagePreview');
    const groupSelect = document.getElementById('groupSelect');
    const categorySelect = document.getElementById('categorySelect');
    const statusText = document.getElementById('statusText');
    const locationInfo = document.getElementById('locationInfo');
    const queueContainer = document.getElementById('queueContainer');
    const queueCount = document.getElementById('queueCount');
    const queueBadge = document.getElementById('queueBadge');

    let currentBase64 = null;
    let db;

    const request = indexedDB.open('FossilCollectorDB', 3);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains('drafts')) {
        db.createObjectStore('drafts', { keyPath: 'id', autoIncrement: true });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      renderQueue();
    };

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).style.display = 'block';
      event.currentTarget.classList.add('active');
    }

    function updateSpeciesDropdown() {
      const selectedGroup = groupSelect.value;
      categorySelect.innerHTML = '<option value="UNSORTED">-- Unsorted / Assign Later --</option>';
      
      const filtered = selectedGroup === "ALL" 
        ? SPECIES_DATA 
        : SPECIES_DATA.filter(s => s.group === selectedGroup);

      filtered.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        categorySelect.appendChild(opt);
      });
      showLocationInfo();
    }

    function showLocationInfo() {
      const val = categorySelect.value;
      const found = SPECIES_DATA.find(s => s.id === val);
      locationInfo.innerText = found ? `📍 Common Location: ${found.location}` : "";
    }

    snapBtn.addEventListener('click', () => cameraInput.click());

    cancelBtn.addEventListener('click', () => {
      resetForm();
      statusText.innerText = "Cancelled.";
    });

    cameraInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          currentBase64 = event.target.result;
          imagePreview.src = currentBase64;
          imagePreview.style.display = 'block';
          actionControls.style.display = 'flex';
        };
        reader.readAsDataURL(file);
      }
    });

    uploadBtn.addEventListener('click', () => {
      const selectedCategory = categorySelect.value;
      if (!currentBase64) return;

      if (selectedCategory === "UNSORTED") {
        saveToDrafts(currentBase64, "UNSORTED", "Saved to Drafts Queue!");
      } else {
        sendToGoogleDrive(currentBase64, selectedCategory, null);
      }
    });

    function saveToDrafts(base64Data, category, message) {
      if (!db) return;
      const tx = db.transaction('drafts', 'readwrite');
      tx.objectStore('drafts').add({
        image: base64Data,
        category: category,
        timestamp: Date.now()
      });
      tx.oncomplete = () => {
        statusText.innerText = message;
        resetForm();
        renderQueue();
      };
    }

    function sendToGoogleDrive(base64Data, category, draftId = null) {
      statusText.innerText = "Uploading to Drive...";

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ image: base64Data, category: category, timestamp: Date.now() })
      })
      .then(res => res.json())
      .then(res => {
        if(res.status === "success") {
          statusText.innerText = "Saved to Drive!";
          if (draftId !== null) deleteDraft(draftId);
          else resetForm();
        } else {
          statusText.innerText = "Error: " + res.message;
        }
      })
      .catch(() => {
        if (draftId === null) {
          saveToDrafts(base64Data, category, "Offline: Saved to Queue.");
        } else {
          statusText.innerText = "Offline. Remains in Queue.";
        }
      });
    }

    function renderQueue() {
      if (!db) return;
      const tx = db.transaction('drafts', 'readonly');
      const store = tx.objectStore('drafts');
      const request = store.getAll();

      request.onsuccess = () => {
        const items = request.result;
        queueCount.innerText = items.length;
        queueBadge.innerText = items.length;
        queueBadge.style.display = items.length > 0 ? 'inline-block' : 'none';

        queueContainer.innerHTML = items.length === 0 ? '<p style="font-size:0.85rem; color:var(--subtext-color);">Queue is empty.</p>' : '';

        items.forEach((item) => {
          const div = document.createElement('div');
          div.className = 'queue-item';

          let optionsHtml = '<option value="UNSORTED">-- Unsorted / Assign Later --</option>';
          SPECIES_DATA.forEach(s => {
            const isSelected = item.category === s.id ? 'selected' : '';
            optionsHtml += `<option value="${s.id}" ${isSelected}>${s.name}</option>`;
          });

          div.innerHTML = `
            <img src="${item.image}" class="queue-thumb" onclick="openZoomModal('${item.image}')">
            <div class="queue-controls">
              <select id="select-${item.id}">${optionsHtml}</select>
              <div class="queue-action-btns">
                <button class="btn-save" onclick="assignAndUpload(${item.id})">Upload</button>
                <button class="btn-delete" onclick="deleteDraft(${item.id})">Delete</button>
              </div>
            </div>
          `;
          queueContainer.appendChild(div);
        });
      };
    }

    window.assignAndUpload = function(id) {
      const catSelect = document.getElementById(`select-${id}`);
      if (!catSelect.value || catSelect.value === "UNSORTED") {
        alert("Please select a species first.");
        return;
      }
      const tx = db.transaction('drafts', 'readonly');
      const request = tx.objectStore('drafts').get(id);
      request.onsuccess = () => sendToGoogleDrive(request.result.image, catSelect.value, id);
    };

    window.deleteDraft = function(id) {
      const tx = db.transaction('drafts', 'readwrite');
      tx.objectStore('drafts').delete(id);
      tx.oncomplete = () => renderQueue();
    };

    function resetForm() {
      imagePreview.style.display = 'none';
      actionControls.style.display = 'none';
      currentBase64 = null;
      cameraInput.value = "";
    }

    let currentScale = 1;
    let startDist = 0;
    const modalImg = document.getElementById('modalImg');

    window.openZoomModal = function(src) {
      modalImg.src = src;
      currentScale = 1;
      modalImg.style.transform = `scale(1)`;
      document.getElementById('imageModal').style.display = 'block';
    };

    window.closeModal = function() {
      document.getElementById('imageModal').style.display = 'none';
    };

    const modalWrapper = document.getElementById('modalWrapper');
    modalWrapper.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        startDist = Math.hypot(
          e.touches[0].pageX - e.touches[1].pageX,
          e.touches[0].pageY - e.touches[1].pageY
        );
      }
    });

    modalWrapper.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].pageX - e.touches[1].pageX,
          e.touches[0].pageY - e.touches[1].pageY
        );
        const factor = dist / startDist;
        currentScale = Math.min(Math.max(1, currentScale * factor), 4);
        modalImg.style.transform = `scale(${currentScale})`;
        startDist = dist;
      }
    });

    updateSpeciesDropdown();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
