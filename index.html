<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fossil Collector</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-color: #1c1c1e;
      --card-bg: #2c2c2e;
      --accent-color: #0a84ff;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --border-color: #38383a;
      --success-color: #30d158;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 450px;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    label {
      font-size: 0.85rem;
      color: var(--subtext-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 8px;
    }

    select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #3a3a3c;
      color: var(--text-color);
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    button {
      background-color: var(--accent-color);
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    .preview-img {
      width: 100%;
      border-radius: 8px;
      display: none;
      margin-bottom: 12px;
    }

    .status {
      text-align: center;
      font-size: 0.9rem;
      color: var(--subtext-color);
      min-height: 20px;
    }

    /* Queue & Inspector Styling */
    .queue-item {
      display: flex;
      gap: 12px;
      background-color: #3a3a3c;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      align-items: center;
    }

    .queue-thumb {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid var(--accent-color);
    }

    .queue-controls {
      flex: 1;
    }

    .queue-controls select {
      margin-bottom: 6px;
      padding: 6px;
      font-size: 0.85rem;
    }

    .queue-controls button {
      margin-bottom: 0;
      padding: 6px;
      font-size: 0.85rem;
      background-color: var(--success-color);
    }

    /* Modal Image Inspector */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .modal-content {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 8px;
      object-fit: contain;
    }

    .close-modal {
      color: white;
      font-size: 30px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Fossil Collector</h1>

    <!-- Capture Card -->
    <div class="card">
      <label for="categorySelect">Select Target Species</label>
      <select id="categorySelect">
        <option value="UNSORTED">-- Unsorted / Assign Later --</option>
        <option value="amber_fossil">amber_fossil</option>
        <option value="ammonite_unspecified">ammonite_unspecified</option>
        <option value="anahoplites">anahoplites</option>
        <option value="arietites">arietites</option>
        <option value="asteroceras">asteroceras</option>
        <option value="becheiceras">becheiceras</option>
        <option value="belemnite_guard">belemnite_guard</option>
        <option value="cadoceras">cadoceras</option>
        <option value="calymene_trilobite">calymene_trilobite</option>
        <option value="clypeus_echinoid">clypeus_echinoid</option>
        <option value="crinoid_general">crinoid_general</option>
        <option value="cyclothyris_brachiopod">cyclothyris_brachiopod</option>
        <option value="dactylioceras">dactylioceras</option>
        <option value="dalmanites_trilobite">dalmanites_trilobite</option>
        <option value="deshayesites">deshayesites</option>
        <option value="dinosaur_bone_fragment">dinosaur_bone_fragment</option>
        <option value="echinocorys_echinoid">echinocorys_echinoid</option>
        <option value="eldredgeops_phacops">eldredgeops_phacops</option>
        <option value="euhoplites">euhoplites</option>
        <option value="gryphaea_fossil">gryphaea_fossil</option>
        <option value="harpoceras">harpoceras</option>
        <option value="hemicidaris_echinoid">hemicidaris_echinoid</option>
        <option value="hildoceras">hildoceras</option>
        <option value="hoplites">hoplites</option>
        <option value="hybodus_shark_fin_spine">hybodus_shark_fin_spine</option>
        <option value="ichthyosaur_general">ichthyosaur_general</option>
        <option value="kosmoceras">kosmoceras</option>
        <option value="lithostrotion_coral">lithostrotion_coral</option>
        <option value="lituites_cephalopod">lituites_cephalopod</option>
        <option value="megalodon_tooth">megalodon_tooth</option>
        <option value="micraster_echinoid">micraster_echinoid</option>
        <option value="montlivaltia_coral">montlivaltia_coral</option>
        <option value="nautilus_fossil">nautilus_fossil</option>
        <option value="ogygiocarella_trilobite">ogygiocarella_trilobite</option>
        <option value="otodus_shark_tooth">otodus_shark_tooth</option>
        <option value="paradoxides_trilobite">paradoxides_trilobite</option>
        <option value="pecten_bivalve">pecten_bivalve</option>
        <option value="perisphinctes">perisphinctes</option>
        <option value="phylloceras">phylloceras</option>
        <option value="plant_sigillaria_lepidodendron">plant_sigillaria_lepidodendron</option>
        <option value="plesiosaur_teeth">plesiosaur_teeth</option>
        <option value="plesiosaur_vertebra">plesiosaur_vertebra</option>
        <option value="promicroceras">promicroceras</option>
        <option value="pycnodont_tooth">pycnodont_tooth</option>
        <option value="quenstedtoceras">quenstedtoceras</option>
        <option value="rhynchonella_brachiopod">rhynchonella_brachiopod</option>
        <option value="schloenbachia">schloenbachia</option>
        <option value="spondylus_bivalve">spondylus_bivalve</option>
        <option value="striatolamia_shark_tooth">striatolamia_shark_tooth</option>
        <option value="terebratula_brachiopod">terebratula_brachiopod</option>
        <option value="titanites">titanites</option>
        <option value="trace_fossil_burrow_and_worm_tube">trace_fossil_burrow_and_worm_tube</option>
        <option value="xipheroceras">xipheroceras</option>
      </select>

      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
      <button id="snapBtn">📷 Take Photo</button>
      <img id="imagePreview" class="preview-img" alt="Preview">
      <button id="uploadBtn" style="display:none;">Upload Photo</button>
      <div id="statusText" class="status"></div>
    </div>

    <!-- Unsorted Queue Section -->
    <div class="card" id="queueCard" style="display: none;">
      <label>Unsorted Drafts (<span id="queueCount">0</span>)</label>
      <div id="queueContainer"></div>
    </div>
  </div>

  <!-- Large Image Inspector Modal -->
  <div id="imageModal" class="modal" onclick="closeModal()">
    <img id="modalImg" class="modal-content">
    <div class="close-modal">&times;</div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxLACQ3MCDFxzv4Q9zslvSbTt4oxOtfud5uqkvdITCwG2SB6CmvCeNs4JeTbm4DQqU/exec";

    const CATEGORIES = [
      "amber_fossil", "ammonite_unspecified", "anahoplites", "arietites", "asteroceras", "becheiceras", 
      "belemnite_guard", "cadoceras", "calymene_trilobite", "clypeus_echinoid", "crinoid_general", 
      "cyclothyris_brachiopod", "dactylioceras", "dalmanites_trilobite", "deshayesites", "dinosaur_bone_fragment", 
      "echinocorys_echinoid", "eldredgeops_phacops", "euhoplites", "gryphaea_fossil", "harpoceras", 
      "hemicidaris_echinoid", "hildoceras", "hoplites", "hybodus_shark_fin_spine", "ichthyosaur_general", 
      "kosmoceras", "lithostrotion_coral", "lituites_cephalopod", "megalodon_tooth", "micraster_echinoid", 
      "montlivaltia_coral", "nautilus_fossil", "ogygiocarella_trilobite", "otodus_shark_tooth", 
      "paradoxides_trilobite", "pecten_bivalve", "perisphinctes", "phylloceras", "plant_sigillaria_lepidodendron", 
      "plesiosaur_teeth", "plesiosaur_vertebra", "promicroceras", "pycnodont_tooth", "quenstedtoceras", 
      "rhynchonella_brachiopod", "schloenbachia", "spondylus_bivalve", "striatolamia_shark_tooth", 
      "terebratula_brachiopod", "titanites", "trace_fossil_burrow_and_worm_tube", "xipheroceras"
    ];

    const cameraInput = document.getElementById('cameraInput');
    const snapBtn = document.getElementById('snapBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const imagePreview = document.getElementById('imagePreview');
    const categorySelect = document.getElementById('categorySelect');
    const statusText = document.getElementById('statusText');
    const queueCard = document.getElementById('queueCard');
    const queueContainer = document.getElementById('queueContainer');
    const queueCount = document.getElementById('queueCount');

    let currentBase64 = null;
    let db;

    // Initialize IndexedDB
    const request = indexedDB.open('FossilCollectorDB', 2);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains('drafts')) {
        db.createObjectStore('drafts', { keyPath: 'id', autoIncrement: true });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      renderQueue();
    };

    snapBtn.addEventListener('click', () => cameraInput.click());

    cameraInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          currentBase64 = event.target.result;
          imagePreview.src = currentBase64;
          imagePreview.style.display = 'block';
          uploadBtn.style.display = 'block';
          statusText.innerText = "";
        };
        reader.readAsDataURL(file);
      }
    });

    uploadBtn.addEventListener('click', () => {
      const selectedCategory = categorySelect.value;
      if (!currentBase64) return;

      if (selectedCategory === "UNSORTED") {
        const tx = db.transaction('drafts', 'readwrite');
        tx.objectStore('drafts').add({
          image: currentBase64,
          timestamp: Date.now()
        });
        tx.oncomplete = () => {
          statusText.innerText = "Saved to Unsorted Drafts!";
          resetForm();
          renderQueue();
        };
      } else {
        sendToGoogleDrive(currentBase64, selectedCategory, null);
      }
    });

    function sendToGoogleDrive(base64Data, category, draftId = null) {
      statusText.innerText = "Uploading to Drive...";

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          image: base64Data,
          category: category,
          timestamp: Date.now()
        })
      })
      .then(res => res.json())
      .then(res => {
        if(res.status === "success") {
          statusText.innerText = "Saved to Drive successfully!";
          if (draftId !== null) {
            const tx = db.transaction('drafts', 'readwrite');
            tx.objectStore('drafts').delete(draftId);
            tx.oncomplete = () => renderQueue();
          } else {
            resetForm();
          }
        } else {
          statusText.innerText = "Error: " + res.message;
        }
      })
      .catch((err) => {
        statusText.innerText = "Network error. Item remains saved locally.";
      });
    }

    function renderQueue() {
      if (!db) return;
      const tx = db.transaction('drafts', 'readonly');
      const store = tx.objectStore('drafts');
      const request = store.getAll();

      request.onsuccess = () => {
        const items = request.result;
        queueCount.innerText = items.length;

        if (items.length === 0) {
          queueCard.style.display = 'none';
          return;
        }

        queueCard.style.display = 'block';
        queueContainer.innerHTML = '';

        items.forEach((item) => {
          const div = document.createElement('div');
          div.className = 'queue-item';
          
          let optionsHtml = '<option value="">-- Choose Category --</option>';
          CATEGORIES.forEach(cat => {
            optionsHtml += `<option value="${cat}">${cat}</option>`;
          });

          div.innerHTML = `
            <img src="${item.image}" class="queue-thumb" onclick="inspectImage('${item.image}')" title="Tap to inspect full size">
            <div class="queue-controls">
              <select id="select-${item.id}">${optionsHtml}</select>
              <button onclick="assignAndUpload(${item.id})">Save to Drive</button>
            </div>
          `;
          queueContainer.appendChild(div);
        });
      };
    }

    window.assignAndUpload = function(id) {
      const catSelect = document.getElementById(`select-${id}`);
      const category = catSelect.value;

      if (!category) {
        alert("Please select a fossil category first.");
        return;
      }

      const tx = db.transaction('drafts', 'readonly');
      const store = tx.objectStore('drafts');
      const request = store.get(id);

      request.onsuccess = () => {
        const item = request.result;
        sendToGoogleDrive(item.image, category, id);
      };
    };

    window.inspectImage = function(base64Src) {
      document.getElementById('modalImg').src = base64Src;
      document.getElementById('imageModal').style.display = 'flex';
    };

    window.closeModal = function() {
      document.getElementById('imageModal').style.display = 'none';
    };

    function resetForm() {
      imagePreview.style.display = 'none';
      uploadBtn.style.display = 'none';
      currentBase64 = null;
      cameraInput.value = "";
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
