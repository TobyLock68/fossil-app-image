<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Fossil Collector</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; background: #1c1c1e; color: #fff; margin: 0; }
    .card { background: #2c2c2e; padding: 20px; border-radius: 16px; max-width: 400px; margin: auto; }
    h2 { margin-top: 0; text-align: center; }
    label { font-size: 14px; color: #aaa; margin-bottom: 6px; display: block; }
    select, button { width: 100%; padding: 14px; margin-top: 10px; font-size: 16px; border-radius: 10px; border: none; box-sizing: border-box; }
    select { background: #3a3a3c; color: white; }
    button { background: #0a84ff; color: white; font-weight: bold; }
    button:active { opacity: 0.8; }
    .btn-secondary { background: #30d158; }
    #preview { width: 100%; max-height: 250px; object-fit: contain; margin-top: 15px; border-radius: 10px; display: none; }
    #status { margin-top: 15px; font-size: 14px; text-align: center; color: #ffd60a; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Fossil Collector</h2>
    
    <label for="species">Select Target Folder:</label>
    <select id="species">
      <option value="amber_fossil">amber_fossil</option>
      <option value="ammonite_unspecified">ammonite_unspecified</option>
      <option value="anahoplites">anahoplites</option>
      <option value="arietites">arietites</option>
      <option value="asteroceras">asteroceras</option>
      <option value="becheiceras">becheiceras</option>
      <option value="belemnite_guard">belemnite_guard</option>
      <option value="cadoceras">cadoceras</option>
      <option value="calymene_trilobite">calymene_trilobite</option>
      <option value="clypeus_echinoid">clypeus_echinoid</option>
      <option value="crinoid_general">crinoid_general</option>
      <option value="cyclothyris_brachiopod">cyclothyris_brachiopod</option>
      <option value="dactylioceras">dactylioceras</option>
      <option value="dalmanites_trilobite">dalmanites_trilobite</option>
      <option value="deshayesites">deshayesites</option>
      <option value="dinosaur_bone_fragment">dinosaur_bone_fragment</option>
      <option value="echinocorys_echinoid">echinocorys_echinoid</option>
      <option value="eldredgeops_phacops">eldredgeops_phacops</option>
      <option value="euhoplites">euhoplites</option>
      <option value="gryphaea_fossil">gryphaea_fossil</option>
      <option value="harpoceras">harpoceras</option>
      <option value="hemicidaris_echinoid">hemicidaris_echinoid</option>
      <option value="hildoceras">hildoceras</option>
      <option value="hoplites">hoplites</option>
      <option value="hybodus_shark_fin_spine">hybodus_shark_fin_spine</option>
      <option value="ichthyosaur_general">ichthyosaur_general</option>
      <option value="kosmoceras">kosmoceras</option>
      <option value="lithostrotion_coral">lithostrotion_coral</option>
      <option value="lituites_cephalopod">lituites_cephalopod</option>
      <option value="megalodon_tooth">megalodon_tooth</option>
      <option value="micraster_echinoid">micraster_echinoid</option>
      <option value="montlivaltia_coral">montlivaltia_coral</option>
      <option value="nautilus_fossil">nautilus_fossil</option>
      <option value="ogygiocarella_trilobite">ogygiocarella_trilobite</option>
      <option value="otodus_shark_tooth">otodus_shark_tooth</option>
      <option value="paradoxides_trilobite">paradoxides_trilobite</option>
      <option value="pecten_bivalve">pecten_bivalve</option>
      <option value="perisphinctes">perisphinctes</option>
      <option value="phylloceras">phylloceras</option>
      <option value="plant_sigillaria_lepidodendron">plant_sigillaria_lepidodendron</option>
      <option value="plesiosaur_teeth">plesiosaur_teeth</option>
      <option value="plesiosaur_vertebra">plesiosaur_vertebra</option>
      <option value="promicroceras">promicroceras</option>
      <option value="pycnodont_tooth">pycnodont_tooth</option>
      <option value="quenstedtoceras">quenstedtoceras</option>
      <option value="rhynchonella_brachiopod">rhynchonella_brachiopod</option>
      <option value="schloenbachia">schloenbachia</option>
      <option value="spondylus_bivalve">spondylus_bivalve</option>
      <option value="striatolamia_shark_tooth">striatolamia_shark_tooth</option>
      <option value="terebratula_brachiopod">terebratula_brachiopod</option>
      <option value="titanites">titanites</option>
      <option value="trace_fossil_burrow_and_worm_tube">trace_fossil_burrow_and_worm_tube</option>
      <option value="xipheroceras">xipheroceras</option>
    </select>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
    <button onclick="document.getElementById('cameraInput').click()">📷 Take Fossil Photo</button>
    <img id="preview" alt="Preview">

    <button class="btn-secondary" onclick="saveAndUpload()">Save & Sync</button>
    <div id="status">Ready</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let db;
    const request = indexedDB.open("FossilCollectorDB", 1);
    request.onupgradeneeded = e => {
      db = e.target.result;
      db.createObjectStore("pendingUploads", { autoIncrement: true });
    };
    request.onsuccess = e => { db = e.target.result; checkPendingUploads(); };

    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    let currentBase64 = null;

    cameraInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => {
          currentBase64 = ev.target.result;
          preview.src = currentBase64;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxLACQ3MCDFxzv4Q9zslvSbTt4oxOtfud5uqkvdITCwG2SB6CmvCeNs4JeTbm4DQqU/exec";

    function saveAndUpload() {
      if (!currentBase64) return alert("Take a photo first.");
      const species = document.getElementById('species').value;
      const data = { species, image: currentBase64, timestamp: new Date().toISOString() };

      if (navigator.onLine) {
        uploadToDrive(data);
      } else {
        saveToIndexedDB(data);
      }
    }

    function saveToIndexedDB(data) {
      const tx = db.transaction("pendingUploads", "readwrite");
      tx.objectStore("pendingUploads").add(data);
      document.getElementById('status').innerText = "Offline: Stored locally. Will auto-sync when online.";
      resetForm();
    }

    function uploadToDrive(data) {
      document.getElementById('status').innerText = "Uploading to Drive...";
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(res => {
        if(res.status === "success") {
          document.getElementById('status').innerText = "Upload complete!";
          resetForm();
        } else {
          document.getElementById('status').innerText = "Error: " + res.message;
        }
      })
      .catch(() => saveToIndexedDB(data));
    }

    window.addEventListener('online', checkPendingUploads);

    function checkPendingUploads() {
      if (!navigator.onLine || !db) return;
      const tx = db.transaction("pendingUploads", "readwrite");
      const store = tx.objectStore("pendingUploads");
      const req = store.openCursor();

      req.onsuccess = e => {
        const cursor = e.target.result;
        if (cursor) {
          const record = cursor.value;
          fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(record) })
            .then(res => res.json())
            .then(res => {
              if (res.status === "success") {
                const delTx = db.transaction("pendingUploads", "readwrite");
                delTx.objectStore("pendingUploads").delete(cursor.key);
              }
              cursor.continue();
            });
        }
      };
    }

    function resetForm() {
      preview.style.display = 'none';
      currentBase64 = null;
    }
  </script>
</body>
</html>
