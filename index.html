<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fossil Collector</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-color: #1c1c1e;
      --card-bg: #2c2c2e;
      --accent-color: #0a84ff;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --border-color: #38383a;
      --success-color: #30d158;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 450px;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    label {
      font-size: 0.85rem;
      color: var(--subtext-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 8px;
    }

    select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #3a3a3c;
      color: var(--text-color);
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    button {
      background-color: var(--accent-color);
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    .preview-img {
      width: 100%;
      border-radius: 8px;
      display: none;
      margin-bottom: 12px;
    }

    .status {
      text-align: center;
      font-size: 0.9rem;
      color: var(--subtext-color);
      min-height: 20px;
    }

    /* Unsorted Queue Styling */
    .queue-item {
      display: flex;
      gap: 12px;
      background-color: #3a3a3c;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      align-items: center;
    }

    .queue-thumb {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
    }

    .queue-controls {
      flex: 1;
    }

    .queue-controls select {
      margin-bottom: 6px;
      padding: 6px;
      font-size: 0.85rem;
    }

    .queue-controls button {
      margin-bottom: 0;
      padding: 6px;
      font-size: 0.85rem;
      background-color: var(--success-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Fossil Capture</h1>

    <!-- Capture Card -->
    <div class="card">
      <label for="categorySelect">Select Target Species</label>
      <select id="categorySelect">
        <option value="UNSORTED">-- Unsorted / Assign Later --</option>
        <option value="calymene_trilobite">calymene_trilobite</option>
        <option value="dactylioceras">dactylioceras</option>
        <option value="amber_fossil">amber_fossil</option>
        <!-- Add your full list of categories here -->
      </select>

      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
      
      <button id="snapBtn">📷 Take Photo</button>
      
      <img id="imagePreview" class="preview-img" alt="Preview">
      
      <button id="uploadBtn" style="display:none;">Upload Photo</button>
      
      <div id="statusText" class="status"></div>
    </div>

    <!-- Unsorted Queue Section -->
    <div class="card" id="queueCard" style="display: none;">
      <label>Unsorted Drafts (<span id="queueCount">0</span>)</label>
      <div id="queueContainer"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    const cameraInput = document.getElementById('cameraInput');
    const snapBtn = document.getElementById('snapBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const imagePreview = document.getElementById('imagePreview');
    const categorySelect = document.getElementById('categorySelect');
    const statusText = document.getElementById('statusText');
    const queueCard = document.getElementById('queueCard');
    const queueContainer = document.getElementById('queueContainer');
    const queueCount = document.getElementById('queueCount');

    let currentBase64 = null;
    let db;

    // Initialize IndexedDB
    const request = indexedDB.open('FossilCollectorDB', 2);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains('drafts')) {
        db.createObjectStore('drafts', { keyPath: 'id', autoIncrement: true });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      renderQueue();
    };

    snapBtn.addEventListener('click', () => cameraInput.click());

    cameraInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          currentBase64 = event.target.result;
          imagePreview.src = currentBase64;
          imagePreview.style.display = 'block';
          uploadBtn.style.display = 'block';
          statusText.innerText = "";
        };
        reader.readAsDataURL(file);
      }
    });

    uploadBtn.addEventListener('click', () => {
      const selectedCategory = categorySelect.value;

      if (!currentBase64) return;

      if (selectedCategory === "UNSORTED") {
        // Save to Draft Queue
        const tx = db.transaction('drafts', 'readwrite');
        tx.objectStore('drafts').add({
          image: currentBase64,
          timestamp: Date.now()
        });
        tx.oncomplete = () => {
          statusText.innerText = "Saved to Unsorted Drafts!";
          resetForm();
          renderQueue();
        };
      } else {
        // Direct Upload to Apps Script
        sendToGoogleDrive(currentBase64, selectedCategory, null);
      }
    });

    function sendToGoogleDrive(base64Data, category, draftId = null) {
      statusText.innerText = "Uploading to Drive...";

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          image: base64Data,
          category: category,
          timestamp: Date.now()
        })
      })
      .then(() => {
        statusText.innerText = "Successfully saved to Drive!";
        if (draftId !== null) {
          // Remove from draft queue if it was an unsorted draft
          const tx = db.transaction('drafts', 'readwrite');
          tx.objectStore('drafts').delete(draftId);
          tx.oncomplete = () => renderQueue();
        } else {
          resetForm();
        }
      })
      .catch((err) => {
        statusText.innerText = "Error uploading. Saved offline.";
      });
    }

    function renderQueue() {
      if (!db) return;
      const tx = db.transaction('drafts', 'readonly');
      const store = tx.objectStore('drafts');
      const request = store.getAll();

      request.onsuccess = () => {
        const items = request.result;
        queueCount.innerText = items.length;

        if (items.length === 0) {
          queueCard.style.display = 'none';
          return;
        }

        queueCard.style.display = 'block';
        queueContainer.innerHTML = '';

        items.forEach((item) => {
          const div = document.createElement('div');
          div.className = 'queue-item';
          div.innerHTML = `
            <img src="${item.image}" class="queue-thumb">
            <div class="queue-controls">
              <select id="select-${item.id}">
                <option value="">-- Choose Category --</option>
                <option value="calymene_trilobite">calymene_trilobite</option>
                <option value="dactylioceras">dactylioceras</option>
                <option value="amber_fossil">amber_fossil</option>
              </select>
              <button onclick="assignAndUpload(${item.id})">Save to Drive</button>
            </div>
          `;
          queueContainer.appendChild(div);
        });
      };
    }

    window.assignAndUpload = function(id) {
      const catSelect = document.getElementById(`select-${id}`);
      const category = catSelect.value;

      if (!category) {
        alert("Please select a category first.");
        return;
      }

      const tx = db.transaction('drafts', 'readonly');
      const store = tx.objectStore('drafts');
      const request = store.get(id);

      request.onsuccess = () => {
        const item = request.result;
        sendToGoogleDrive(item.image, category, id);
      };
    };

    function resetForm() {
      imagePreview.style.display = 'none';
      uploadBtn.style.display = 'none';
      currentBase64 = null;
      cameraInput.value = "";
    }

    // Register Service Worker for PWA offline caching
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
